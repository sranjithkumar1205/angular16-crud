<div class="product-list">
  <h2>Products</h2>
  <div class="actions">
    <button (click)="create()">Create Product</button>
  </div>

  <div class="filters">
    <div class="search">
      <input type="text" 
             placeholder="Search products..." 
             #searchBox
             (input)="search(searchBox.value)">
    </div>
    
    <div class="price-range">
      <input type="number" 
             placeholder="Min price" 
             #minPrice
             (input)="updatePriceRange(+minPrice.value || undefined, +maxPrice.value || undefined)">
      <span>to</span>
      <input type="number" 
             placeholder="Max price" 
             #maxPrice
             (input)="updatePriceRange(+minPrice.value || undefined, +maxPrice.value || undefined)">
    </div>
  </div>

  <div *ngIf="products$ | async as products">
    <table *ngIf="products.length; else empty">
      <thead>
        <tr>
          <th>ID</th>
          <th (click)="sort('name')" class="sortable">
            Name {{getSortIndicator('name')}}
          </th>
          <th (click)="sort('price')" class="sortable">
            Price {{getSortIndicator('price')}}
          </th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of products">
          <td>{{p.id}}</td>
          <td>{{p.name}}</td>
          <td>{{p.price | currency}}</td>
          <td>
            <button (click)="edit(p.id)">Edit</button>
            <button (click)="delete(p.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
    <ng-template #empty>
      <p>No products found.</p>
    </ng-template>
  </div>
</div>
